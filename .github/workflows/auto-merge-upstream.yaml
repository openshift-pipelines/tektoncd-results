# Generated for Konflux Application openshift-pipelines-core by openshift-pipelines/hack. DO NOT EDIT
name: auto-merge-upstream-tektoncd/results

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0,30 * * * *"

jobs:
  auto-approve-and-merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Checkout the current repo
      uses: actions/checkout@v5
    - name: list-prs
      run: |
        echo "Listing PRs"
        gh auth status
        git config user.name openshift-pipelines-bot
        git config user.email pipelines-extcomm@redhat.com
        # Approve and merge pull-request with no reviews

        pr_list=$(gh pr list \
          --state open \
          --label upstream  \
          --json number --jq .[].number | tr '\n' ' '  )
          #        pr_list=$(gh pr list \
          #          --state open \
          #          --label upstream \
          #          --json number,title,statusCheckRollup \
          #          --jq ' .[]| select((.statusCheckRollup // [])| all(.conclusion == "SUCCESS" or .conclusion == "SKIPPED"))| "\(.number)"')
        set -x
        echo pr_list="$pr_list"  >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: approve and add LGTM Labels
      run: |
        # Approve and merge pull-request with no reviews
        
        pr_list=${{ steps.list-prs.outputs.pr_list }}
        for p in $pr_list; do
          echo "Approving  PR $p"
          gh pr review $p --approve
          echo "Adding lgtm label to  PR $p"
          gh pr edit $p --add-label "lgtm" || true
        done
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Merging PRs
      run: |
        # Approve and merge pull-request with no reviews
        pr_list=${{ steps.list-prs.outputs.pr_list }}
        for p in $pr_list; do
          echo "Merging  PR $p"
          gh pr merge --rebase --delete-branch --auto $p
        done
      env:
        GH_TOKEN: ${{ secrets.OPENSHIFT_PIPELINES_ROBOT }}
